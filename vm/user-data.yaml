#cloud-config
# Template: create.sh replaces __SSH_PUBKEY__ with the VM-only public key.
hostname: sbx-test
users:
  - name: bench            # admin: used by the harness to drive the VM
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - __SSH_PUBKEY__
  - name: agent            # unprivileged: targets and attacks run as this user
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - __SSH_PUBKEY__
ssh_pwauth: false
package_update: true
packages:
  - qemu-guest-agent
  - python3
  - python3-venv
  - git
  - curl
  - jq
  - ca-certificates
  - bubblewrap
  - uidmap
runcmd:
  - systemctl enable --now qemu-guest-agent
  # Marker dir for escape tests (created by the harness per run).
  - install -d -m 0755 -o bench -g bench /var/sbx-bench
final_message: "sbx-test cloud-init finished after $UPTIME seconds"
